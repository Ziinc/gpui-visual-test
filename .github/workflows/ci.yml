name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI and lavapipe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features gpui-visual-test/capture,gpui-visual-test/judges -- -D warnings
      - run: cargo test --workspace --features gpui-visual-test/judges
      - name: Headless capture on lavapipe
        run: cargo test -p gpui-visual-test --features capture --test capture

  integrations:
    runs-on: ubuntu-latest
    env:
      GPUI_VISUAL_TEST_CLI: ${{ github.workspace }}/target/debug/cargo-visual-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cargo-visual-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright helper (JS)
        working-directory: integrations/playwright/js
        run: npm test
      - name: Playwright helper (Python)
        working-directory: integrations/playwright/python
        run: python3 -m unittest -v
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: Elixir helper
        working-directory: integrations/elixir
        run: |
          mix deps.get
          mix format --check-formatted
          mix test

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
